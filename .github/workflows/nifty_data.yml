name: NIFTY Data Collection

on:
  workflow_dispatch:

jobs:
  get-nifty-data:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Get repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. AUTHENTICATE GOOGLE CLOUD
      # ============================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      # ============================================================
      # 3. SETUP PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ============================================================
      # 4. INSTALL PYTHON LIBRARIES
      # ============================================================

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/marketcalls/openchart.git \
            google-cloud-bigquery \
            pandas \
            pyarrow


      # ============================================================
      # 5. SHOW INSTALLED OPENCHART VERSION
      # ============================================================

      - name: Check OpenChart installation
        run: |
          python -c "import openchart; print('OpenChart imported successfully')"
          pip show openchart


      # ============================================================
      # 6. TEST NIFTY DATA
      # ============================================================

      - name: Get NIFTY data
        run: |
          python get_nifty_data.py
