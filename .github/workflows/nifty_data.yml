name: NIFTY Data Collection

on:
  workflow_dispatch:

jobs:
  get-nifty-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Get repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. AUTHENTICATE GOOGLE CLOUD
      # ======================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      # ======================================================
      # 3. SETUP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ======================================================
      # 4. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas \
            google-cloud-bigquery \
            google-cloud-bigquery-storage \
            pyarrow \
            db-dtypes \
            pandas-gbq


      # ======================================================
      # 5. VERIFY INSTALLATION
      # ======================================================

      - name: Verify Python environment
        run: |
          python --version

          python -c "import requests; print('requests OK')"
          python -c "import pandas; print('pandas OK')"
          python -c "import pyarrow; print('pyarrow OK')"
          python -c "import db_dtypes; print('db-dtypes OK')"
          python -c "import pandas_gbq; print('pandas-gbq OK')"
          python -c "from google.cloud import bigquery; print('BigQuery OK')"
          python -c "from google.cloud import bigquery_storage; print('BigQuery Storage OK')"


      # ======================================================
      # 6. RUN NIFTY PIPELINE
      # ======================================================

      - name: Get NIFTY data
        run: |
          python get_nifty_data.py
