name: NIFTY Data Collection

on:
  workflow_dispatch:

jobs:
  get-nifty-data:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. GET REPOSITORY
      # ==================================================

      - name: Get repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. AUTHENTICATE TO GOOGLE CLOUD
      # ==================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      # ==================================================
      # 3. SET UP PYTHON
      # ==================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ==================================================
      # 4. INSTALL LIBRARIES
      # ==================================================

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install pandas
          pip install google-cloud-bigquery
          pip install pyarrow


      # ==================================================
      # 5. CHECK PYTHON / LIBRARIES
      # ==================================================

      - name: Check installation
        run: |
          python --version

          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import google.cloud.bigquery; print('BigQuery library: OK')"
          python -c "import pyarrow; print('pyarrow:', pyarrow.__version__)"


      # ==================================================
      # 6. RUN NIFTY DATA PIPELINE
      # ==================================================

      - name: Get NIFTY data
        run: |
          python get_nifty_data.py
