name: NIFTY Data Collection

on:
  workflow_dispatch:

jobs:
  get-nifty-data:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get repository
      # --------------------------------------------------

      - name: Get repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Authenticate to Google Cloud
      # --------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'


      # --------------------------------------------------
      # 3. Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # --------------------------------------------------
      # 4. Install libraries
      # --------------------------------------------------

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip

          pip install indian-market-data

          pip install pandas
          pip install google-cloud-bigquery
          pip install pyarrow


      # --------------------------------------------------
      # 5. Check installation
      # --------------------------------------------------

      - name: Check installation
        run: |
          python --version
          pip show indian-market-data
          python -c "from nsedata import nse; print('NSEData package imported successfully')"


      # --------------------------------------------------
      # 6. Get NIFTY data
      # --------------------------------------------------

      - name: Get NIFTY data
        run: |
          python get_nifty_data.py
